<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.name }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.tagline }}{% endblock %}">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:url" content="{{ site.url }}{% block path %}/{% endblock %}">
<meta property="og:image" content="{{ site.url }}{% block og_image %}/apple-touch-icon.png{% endblock %}">
<meta name="twitter:card" content="summary">
<link rel="alternate" type="application/atom+xml" title="{{ site.name }}" href="/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="/style.css?v={{ css_v }}">
{% if site.goatcounter %}<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>{% endif %}
{% block head %}{% endblock %}
</head>
<body class="page-{{ page }}">
<header class="masthead">
  <div class="wrap masthead-inner">
    <a class="brand" href="/">
      <img class="brand-icon" src="/logo.svg" alt="" width="64" height="64">
      <span class="brand-text">
        <span class="brand-name">{{ site.name }}</span>
        <span class="brand-lab">{{ site.lab }}</span>
      </span>
    </a>
    <nav aria-label="Site">
      <a href="/"{% if page == "home" %} aria-current="page"{% endif %}>Posts</a>
      <a href="{{ site.lab_url }}">About the lab</a>
    </nav>
  </div>
</header>
<div class="band">{% block band %}{% endblock %}</div>
<main class="wrap">
{% block main %}{% endblock %}
</main>
<footer class="colophon">
  <div class="wrap colophon-inner">
    <span>© {{ year }} {{ site.lab }}, {{ site.org }}</span>
    <span><a href="{{ site.lab_url }}">lgwrightlab.com</a><span class="sep" aria-hidden="true">·</span><a href="/feed.xml">Atom feed</a></span>
  </div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
